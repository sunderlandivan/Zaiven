name = "preeminent-portal"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Never expose an unauthenticated *.workers.dev or preview URL; the only way in is the custom domain below.
workers_dev = false
preview_urls = false
routes = [{ pattern = "portal.preeminentstore.com", custom_domain = true }]

# Every request (pages included) goes through the login + role check in src/index.js before an asset is served.
# dist/ is built by scripts/build-ui.mjs from the PC portal's public/ pages plus cloudflare-portal/public/.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# One trigger (the free plan allows 5 per account); src/cron.js decides what runs on each tick.
[triggers]
crons = ["*/5 * * * *"]

# OWNER_EMAILS is the break-glass owner: always allowed as owner even if the D1 users table is lost.
# Everyone else signs in only if listed in the D1 users table (owner adds them on the Users page).
[vars]
OWNER_EMAILS = "iv3nsun@gmail.com"
STORE_SITE = "https://preeminentstore.com"
ALERT_FROM = "PreEminent Portal <alerts@preeminentstore.com>"

# Secrets (set by scripts/deploy.mjs from the PC's own config), never in this file:
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET  same OAuth client the PC portal uses (GMAIL_CLIENT_ID / GMAIL_CLIENT_SECRET)
#   GOOGLE_REFRESH_TOKEN                    Sheets/Gmail refresh token from data/gmail-sync-settings.json
#   SESSION_SECRET                          32 random bytes, new on every deploy; signs the 10-minute sign-in state cookie
#   AGENT_TOKEN                             same value as the store's AGENT_TOKEN (Zelle/Venmo "mark paid" email)
#   RESEND_API_KEY                          optional; owner alerts (new-device owner sign-in, sign-in lockouts)

# Per-IP request limits, counted by Cloudflare (free; no D1/KV writes). period must be 10 or 60 seconds.
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "41001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RL_API"
namespace_id = "41002"
simple = { limit = 300, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "preeminent-portal"
database_id = "956f6cba-69bc-4817-929e-26b503418ca6"
migrations_dir = "migrations"

# Same namespace as the public store: catalog, stock, manual-pay-config, and order:<id> keys.
[[kv_namespaces]]
binding = "STORE"
id = "f655ff3db54a4aafbd9d98902564dbe7"

[observability]
enabled = true
